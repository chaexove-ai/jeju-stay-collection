<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeju Stay Collection — Handpicked Villas &amp; Stays on Jeju Island</title>
<meta name="description" content="A curated collection of private pool villas, ocean-view retreats and quiet stone houses across Jeju Island — each one visited and looked after by a local team.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Jost:wght@400;500&family=Noto+Serif+TC:wght@400&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
  :root{
    --paper:#FBF9F5; --limestone:#F4F1EA; --hairline:#E0DBD1; --hairline-2:#CDC6B9;
    --linen:#C4BEB2; --ash:#8B857A; --clay:#6E6558; --stone:#57534B; --basalt:#191817;
    --pine:#2F4A43; --pine-dark:#243934; --placeholder:#E6E1D7;
    --serif:"Instrument Serif","Noto Serif TC",Georgia,serif;
    --sans:"Jost","Noto Sans TC","Avenir Next","Helvetica Neue",sans-serif;
    --pad:72px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{
    margin:0; background:var(--paper); color:var(--basalt);
    font-family:var(--sans); font-weight:400; font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; display:block}
  a{color:inherit; text-decoration:none}
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}

  .lbl{font-size:11px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--clay)}
  .rule{height:1px; background:var(--hairline)}
  .wrap{max-width:1440px; margin:0 auto; padding:0 var(--pad)}

  /* ── masthead ───────────────────────────────────────────── */
  .bar{background:var(--paper); border-bottom:1px solid var(--hairline)}
  .bar-in{display:flex; align-items:center; justify-content:space-between; gap:24px; padding:22px 0 20px}
  .brand{display:flex; align-items:center; gap:14px}
  .brand-txt{display:flex; flex-direction:column; gap:3px}
  .brand-txt b{font-size:13px; font-weight:500; letter-spacing:.26em; text-transform:uppercase}
  .brand-txt span{font-size:13px; font-weight:400; letter-spacing:.26em; text-transform:uppercase; color:var(--stone)}
  .lang{display:flex; border:1px solid var(--hairline-2)}
  .lang button{height:44px; min-width:88px; display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:500; letter-spacing:.12em; color:var(--basalt); transition:.15s}
  .lang button[aria-pressed="true"]{background:var(--pine); color:var(--paper)}
  .lang button[data-lang="zh"]{font-family:"Noto Serif TC",serif; letter-spacing:.06em; font-size:13.5px}

  /* ── hero ───────────────────────────────────────────────── */
  .hero{display:grid; grid-template-columns:1fr 1fr; background:var(--paper)}
  .hero-txt{padding:76px 60px 76px 0; display:flex; flex-direction:column}
  .eyebrow{display:flex; align-items:center; gap:14px; margin-bottom:30px}
  .eyebrow i{width:26px; height:1px; background:var(--hairline-2); display:block}
  h1{margin:0 0 26px; font-family:var(--serif); font-weight:400; font-size:clamp(34px,4vw,56px);
     line-height:1.08; letter-spacing:-.015em; text-wrap:pretty}
  h1 em{font-style:italic}
  .lede{margin:0 0 30px; max-width:46ch; font-size:17px; line-height:1.72; color:var(--stone)}
  .hero-act{display:flex; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:34px}
  .avg{display:flex; align-items:center; gap:8px; min-height:50px; font-size:13.5px; color:var(--stone)}
  .avg b{color:var(--basalt); font-weight:500}
  .stats{display:flex; flex-wrap:wrap; gap:52px; padding-top:22px}
  .stat b{display:block; font-family:var(--serif); font-weight:400; font-size:30px; line-height:1; margin-bottom:7px}
  .hero-img{position:relative; min-height:600px; overflow:hidden; background:var(--placeholder)}
  .hero-img img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .hero-cap{position:absolute; left:0; bottom:0; background:var(--paper); padding:13px 22px;
    display:flex; align-items:center; gap:12px; font-size:11px; font-weight:500;
    letter-spacing:.2em; text-transform:uppercase; color:var(--stone)}
  .hero-cap i{width:20px; height:1px; background:var(--hairline-2); display:block}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; height:50px; padding:0 30px;
    background:var(--pine); color:var(--paper); font-size:13px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; transition:.15s; width:100%}
  .btn:hover{background:var(--pine-dark)}
  .btn-o{background:transparent; border:1px solid var(--pine); color:var(--pine)}
  .btn-o:hover{background:var(--pine); color:var(--paper)}
  .btn-o:hover svg{stroke:var(--paper)}
  .btn-auto{width:auto}

  /* ── collection ─────────────────────────────────────────── */
  .coll{background:var(--limestone); border-top:1px solid var(--hairline-2); padding:76px 0 88px}
  .coll-head{display:flex; align-items:flex-end; justify-content:space-between; gap:32px; margin-bottom:26px}
  .coll-head h2{margin:0; font-family:var(--serif); font-weight:400; font-size:36px; letter-spacing:-.01em}
  .coll-note{font-size:13.5px; color:var(--stone); padding-bottom:8px; max-width:46ch}

  .filters{display:flex; flex-direction:column; gap:14px; margin-bottom:22px}
  .frow{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
  .frow > .lbl{width:76px; flex:none}
  .chip{display:inline-flex; align-items:center; height:40px; padding:0 18px; border:1px solid var(--hairline-2);
    font-size:12.5px; color:var(--basalt); white-space:nowrap; transition:.15s}
  .chip:hover{border-color:var(--stone)}
  .chip[aria-pressed="true"]{background:var(--pine); border-color:var(--pine); color:var(--paper); font-weight:500}
  .count-row{display:flex; align-items:center; justify-content:space-between; gap:24px; padding-bottom:14px}
  .count-row .n{font-size:14px; color:var(--stone)}
  .count-row .n b{color:var(--basalt); font-weight:500}

  .grid{display:grid; gap:40px; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:stretch}
  .card{background:var(--paper); border:1px solid var(--hairline); padding:14px 14px 22px;
    display:flex; flex-direction:column; height:100%}
  .thumb{position:relative; aspect-ratio:4/5; overflow:hidden; background:var(--placeholder)}
  .thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .thumb .ph{position:absolute; inset:0; display:grid; place-items:center;
    font-family:var(--serif); font-size:44px; color:rgba(255,255,255,.9)}
  .flag{position:absolute; left:0; top:18px; background:var(--paper); color:var(--basalt);
    font-size:10.5px; font-weight:500; letter-spacing:.22em; text-transform:uppercase; padding:8px 14px}
  .c-top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 6px 8px}
  .stars{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--stone); white-space:nowrap}
  .stars b{color:var(--basalt); font-weight:500}
  .card h3{margin:0 6px 10px; font-family:var(--serif); font-weight:400; font-size:26px; line-height:1.2}
  .card p{margin:0 6px 14px; font-size:14.5px; line-height:1.7; color:var(--stone)}
  .incl{font-family:var(--serif); font-style:italic; font-size:15.5px; color:var(--clay); margin:0 6px 12px}
  .tags{display:flex; flex-wrap:wrap; gap:6px 12px; margin:0 6px; font-size:12px; color:var(--clay)}
  .c-foot{margin-top:auto; padding-top:20px}
  .avail{display:flex; align-items:center; padding:15px 6px 13px;
    font-family:var(--serif); font-style:italic; font-size:15.5px; color:var(--clay)}
  .micro{text-align:center; font-size:11.5px; color:var(--clay); padding-top:10px}
  .micro-a{color:var(--pine)}
  .rooms{display:none; margin:12px 6px 0; border-top:1px solid var(--hairline); padding-top:6px}
  .rooms.open{display:block}
  .room{display:flex; align-items:center; justify-content:space-between; gap:12px;
    min-height:56px; padding:10px 0; border-bottom:1px solid var(--hairline)}
  .room:last-child{border-bottom:0}
  .room-n{font-size:14.5px; font-weight:500; line-height:1.3}
  .room-s{font-size:12px; color:var(--clay); margin-top:2px}
  .room-go{flex:none; display:inline-flex; align-items:center; gap:6px; font-size:12px;
    font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--pine); white-space:nowrap}

  .note{border:1px dashed var(--hairline-2); background:var(--paper); padding:26px;
    color:var(--stone); font-size:14.5px; line-height:1.7; grid-column:1/-1}
  .sk{border:1px solid var(--hairline); background:var(--paper); padding:14px 14px 22px}
  .sk .a{aspect-ratio:4/5}
  .sk .b{height:16px; margin:20px 6px 12px}
  .sk .c{height:16px; margin:0 6px; width:62%}
  .shim{background:linear-gradient(90deg,#EBE7DE 25%,#F5F2EC 50%,#EBE7DE 75%); background-size:200% 100%;
    animation:sh 1.3s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ── closing block ──────────────────────────────────────── */
  .dark{background:var(--basalt); padding:92px 0 64px}
  .wall{max-width:880px; margin:0 auto 76px; display:flex; flex-direction:column; align-items:center; gap:30px; text-align:center}
  .wall .eyebrow .lbl{color:var(--linen)}
  .wall .eyebrow i{background:#4A463F}
  .wall-q{font-family:var(--serif); font-size:clamp(24px,3vw,34px); line-height:1.42;
    letter-spacing:-.008em; color:var(--limestone); text-wrap:pretty}
  .wall-s{font-size:14px; line-height:1.8; color:var(--linen); max-width:58ch}
  .dark hr{border:0; height:1px; background:#3A3733; margin:0 0 40px}
  .foot{display:grid; grid-template-columns:4fr 5fr 3fr; gap:40px}
  .foot p{margin:0; font-size:14px; line-height:1.85; color:var(--linen)}
  .foot .meta{display:flex; flex-direction:column; gap:12px; font-size:13px; color:var(--linen)}
  .foot .brand-txt b{color:var(--limestone)}
  .foot .brand-txt span{color:var(--linen)}

  @media (max-width:1080px){
    :root{--pad:40px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:28px}
    .foot{grid-template-columns:1fr 1fr}
  }
  @media (max-width:760px){
    :root{--pad:20px}
    .hero{grid-template-columns:1fr}
    .hero-txt{padding:32px 0 30px; order:1}
    .hero-img{order:2; min-height:0; height:260px}
    .lede{font-size:15.5px}
    .btn{height:52px}
    .stats{gap:32px}
    .stat b{font-size:24px}
    .coll{padding:34px 0 40px}
    .coll-head{flex-direction:column; align-items:flex-start; gap:12px; margin-bottom:18px}
    .coll-head h2{font-size:30px}
    .frow{flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch}
    .frow::-webkit-scrollbar{display:none}
    .frow > .lbl{display:none}
    .chip{height:44px; font-size:13px}
    .grid{grid-template-columns:1fr; gap:24px}
    .dark{padding:48px 0 36px}
    .wall{margin-bottom:40px; gap:22px}
    .foot{grid-template-columns:1fr; gap:24px}
  }
</style>

    wallS:"我們不收訂房佣金。每一間都直接在 Airbnb 向房東預訂。",
    footer:"由住在濟州島的團隊親自挑選並長期照顧的獨立住宿選輯。",
    contact:"大韓民國 濟州島",
    empty:"<b>尚未載入住宿資料。</b><br>請填寫 Google 試算表，並將共用設定改為「知道連結的任何人 — 檢視者」。",
    none:"<b>沒有符合條件的住宿。</b><br>請放寬地區或人數條件。",
    error:"<b>無法載入住宿清單。</b><br>請確認 Google 試算表已設為「知道連結的任何人 — 檢視者」。"
  }
};

/* ---------- 태그 사전 (시트에는 영문 코드만 입력) ---------- */
const TAGS = {
  POOL:{en:"Private pool",zh:"私人泳池"},      HEATED:{en:"Heated pool",zh:"溫水泳池"},
  INDOOR:{en:"Indoor pool",zh:"室內泳池"},     OCEAN:{en:"Ocean view",zh:"海景"},
  BEACH:{en:"Near beach",zh:"鄰近海灘"},       MOUNTAIN:{en:"Mountain view",zh:"山景"},
  SUNRISE:{en:"Sunrise view",zh:"日出景觀"},   SUNSET:{en:"Sunset view",zh:"日落景觀"},
  JACUZZI:{en:"Jacuzzi",zh:"按摩浴缸"},        SPA:{en:"Spa",zh:"水療"},
  SAUNA:{en:"Finnish sauna",zh:"芬蘭浴"},      CINEMA:{en:"Home cinema",zh:"家庭劇院"},
  KARAOKE:{en:"Karaoke",zh:"卡拉OK"},          BBQ:{en:"BBQ",zh:"烤肉"},
  KITCHEN:{en:"Full kitchen",zh:"完整廚房"},   PARKING:{en:"Free parking",zh:"免費停車"},
  GARDEN:{en:"Garden",zh:"庭園"},              ORCHARD:{en:"Tangerine grove",zh:"橘園景觀"},
  FOREST:{en:"Forest setting",zh:"森林環繞"},  CAMPING:{en:"Camping",zh:"露營"},
  STONE:{en:"Jeju stone house",zh:"濟州石屋"}, DESIGN:{en:"Design stay",zh:"設計旅宿"},
  PHOTO:{en:"Instagrammable",zh:"網美打卡"},   PRIVATE:{en:"Entire place",zh:"獨棟包棟"},
  GROUP:{en:"Group friendly",zh:"適合團體"},   FAMILY:{en:"Family friendly",zh:"適合家庭"},
  COUPLE:{en:"For couples",zh:"適合情侶"},     PET:{en:"Pet friendly",zh:"寵物友善"}
};
/* 화면에 알약으로 나가는 배지는 두 개뿐 —— 신규 등록, 그리고 할인.
   그 밖의 「영문|繁體」 자유 문구(무료 자쿠지 등)는 설명 아래 이탤릭 한 줄로 나간다.
   FEATURED / POPULAR 는 정보가 아니라 자기 선언이라 표시하지 않는다. */
const BADGES = { NEW:{en:"Newly added",zh:"新上架"} };

/* ---------- 유틸 ---------- */
function parseCSV(text){
  const out=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===","){ row.push(cell); cell=""; }
      else if(c==="\n"){ row.push(cell); out.push(row); row=[]; cell=""; }
      else if(c!=="\r") cell+=c;
    }
  }
  if(cell!==""||row.length){ row.push(cell); out.push(row); }
  return out;
}
const esc = s => String(s??"").replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmt = s => esc(s).replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/\r?\n/g,"<br>");
const num = s => { const v=parseFloat(String(s).replace(/[^\d.\-]/g,"")); return Number.isFinite(v)?v:null; };
const isUrl = s => { const v=(s||"").trim(); return /^https?:\/\/\S+\.\S+/.test(v) && !v.startsWith("https://..."); };
function photoSrc(v){
  const s=(v||"").trim();
  if(!s || s.startsWith("https://...")) return "";
  if(/^https?:\/\//.test(s)) return s;
  if(s.startsWith("/")||s.startsWith("./")) return s;
  if(/\.(jpe?g|png|webp|avif)$/i.test(s)) return IMG_DIR.replace(/\/$/,"") + "/" + s;
  return "";
}
const FOCUS = {top:"center top",bottom:"center bottom",left:"left center",right:"right center",center:"center"};
const PH = ["#1c6b7a","#0d3b45","#2F4A43","#6E6558","#3d5058","#134f5c"];
const shortRegion = r => (r||"").split(/[-,]/)[0].trim();

/* ---------- 상태 ---------- */
let lang="en", props=[], SITE={}, HERO=null;
let filt={region:"all", guests:"all", tag:"all"};

/* ---------- 행 → 숙소 ---------- */
const CARRY = ["badge","badgeRaw","nameKo","nameEn","nameZh","regionEn","regionZh",
               "introEn","introZh","tagsRaw","photo","focus","rating","reviews"];

function build(table){
  const body = table.slice(1).filter(r=>r.some(c=>c&&c.trim()));
  const map = new Map(); const site = {};

  for(const c of body){
    const id=(c[3]||"").trim();
    if(!id || id==="숙소ID") continue;

    if(id.startsWith("_")){
      site[id.toLowerCase()] = {
        h1:{en:(c[6]||"").trim(), zh:(c[7]||"").trim()},
        lede:{en:(c[10]||"").trim(), zh:(c[11]||"").trim()},
        photo:(c[17]||"").trim(), focus:(c[19]||"").trim().toLowerCase()
      };
      continue;
    }

    if(!map.has(id)) map.set(id,{id,pin:null,occ:null,rooms:[],
      badge:"",badgeRaw:"",nameKo:"",nameEn:"",nameZh:"",regionEn:"",regionZh:"",
      introEn:"",introZh:"",tagsRaw:"",photo:"",focus:"",rating:null,reviews:null});
    const g=map.get(id);
    if(g.pin===null) g.pin=num(c[0]);
    if(g.occ===null) g.occ=num(c[1]);

    const row={
      badge:(c[4]||"").trim().toUpperCase(), badgeRaw:(c[4]||"").trim(),
      nameKo:(c[5]||"").trim(), nameEn:(c[6]||"").trim(), nameZh:(c[7]||"").trim(),
      regionEn:(c[8]||"").trim(), regionZh:(c[9]||"").trim(),
      introEn:(c[10]||"").trim(), introZh:(c[11]||"").trim(),
      tagsRaw:(c[12]||"").trim(), photo:(c[17]||"").trim(),
      focus:(c[19]||"").trim().toLowerCase(),
      rating:num(c[21]), reviews:num(c[22])
    };
    for(const k of CARRY) if(!g[k] && row[k]) g[k]=row[k];

    const show=(c[2]||"Y").trim().toUpperCase()!=="N";
    const link=(c[18]||"").trim();
    if(show && isUrl(link)){
      g.rooms.push({
        nameEn:(c[13]||"").trim(), nameZh:(c[14]||"").trim(),
        sleeps:num(c[15]), whole:(c[16]||"").trim().toUpperCase()==="Y",
        photo:(c[17]||"").trim(), focus:(c[19]||"").trim().toLowerCase(), link
      });
    }
  }

  const list=[...map.values()].filter(g=>g.rooms.length);
  list.forEach(g=>{
    g.tags = g.tagsRaw.split(",").map(s=>s.trim().toUpperCase()).filter(Boolean);
    g.rooms.sort((a,b)=>(b.whole?1:0)-(a.whole?1:0));
    if(!photoSrc(g.photo)){
      const src=g.rooms.find(r=>photoSrc(r.photo));
      if(src){ g.photo=src.photo; if(!g.focus) g.focus=src.focus; }
    }
    g.photo = photoSrc(g.photo) || "";
    g.maxSleeps = Math.max(0, ...g.rooms.map(r=>r.sleeps||0));
    g.minSleeps = Math.min(...g.rooms.map(r=>r.sleeps||g.maxSleeps||0));
    g.anyWhole  = g.rooms.some(r=>r.whole);
    g.region    = shortRegion(g.regionEn);
    g.bottom    = g.pin!==null && g.pin<0;
  });

  /* 정렬: 고정(양수) → 예약률 낮은 순 → 이름 / 음수 고정은 맨 아래 */
  list.sort((a,b)=>{
    if(a.bottom!==b.bottom) return a.bottom?1:-1;
    if(a.bottom&&b.bottom) return a.pin-b.pin;
    const aT=a.pin!==null, bT=b.pin!==null;
    if(aT!==bT) return aT?-1:1;
    if(aT) return a.pin-b.pin;
    const ao=a.occ===null?9999:a.occ, bo=b.occ===null?9999:b.occ;
    if(ao!==bo) return ao-bo;
    return (a.nameEn||"").localeCompare(b.nameEn||"");
  });
  return {list, site};
}

/* ---------- 히어로 ---------- */
function pickHero(cfg){
  if(cfg && photoSrc(cfg.photo)) return {src:photoSrc(cfg.photo), focus:cfg.focus, stay:null};
  const pool = props.filter(g=>g.photo && !g.bottom);   /* 최하단 고정 숙소는 제외 */
  if(!pool.length) return null;
  const week = Math.floor(Date.now()/6048e5);           /* 주 단위 순환 */
  const g = pool[week % pool.length];
  return {src:g.photo, focus:g.focus, stay:g};
}
function applyHero(cfg){
  SITE={};
  if(cfg?.h1?.en || cfg?.h1?.zh)   SITE.h1   = {en:fmt(cfg.h1.en),   zh:fmt(cfg.h1.zh || cfg.h1.en)};
  if(cfg?.lede?.en || cfg?.lede?.zh) SITE.lede = {en:fmt(cfg.lede.en), zh:fmt(cfg.lede.zh || cfg.lede.en)};
  HERO = pickHero(cfg);
  const img=document.getElementById("heroImg"), cap=document.getElementById("heroCap");
  if(HERO){
    img.src=HERO.src; img.style.objectPosition=FOCUS[HERO.focus]||"center"; img.hidden=false;
    if(HERO.stay){ cap.hidden=false; } else { cap.hidden=true; }
  }
}

/* ---------- 필터 ---------- */
function topTags(){
  const n={};
  props.forEach(g=>g.tags.forEach(t=>{ if(TAGS[t]) n[t]=(n[t]||0)+1; }));
  return Object.entries(n).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
}
function matches(g){
  if(filt.region!=="all" && g.region!==filt.region) return false;
  if(filt.tag!=="all" && !g.tags.includes(filt.tag)) return false;
  if(filt.guests!=="all"){
    const m=g.maxSleeps;
    if(filt.guests==="g1" && !(m>=2&&m<=4)) return false;
    if(filt.guests==="g2" && !(m>=5&&m<=8)) return false;
    if(filt.guests==="g3" && !(m>=9))       return false;
  }
  return true;
}
function renderFilters(){
  const t=T[lang];
  const regions=[...new Set(props.map(g=>g.region).filter(Boolean))];
  const tags=topTags();
  const chip=(label,key,val,on)=>
    `<button type="button" class="chip" data-f="${key}" data-v="${val}" aria-pressed="${on}">${esc(label)}</button>`;
  document.getElementById("filters").innerHTML = `
    <div class="frow">
      <span class="lbl">${esc(t.fWhere)}</span>
      ${chip(t.fAll,"region","all",filt.region==="all")}
      ${regions.map(r=>chip(r,"region",r,filt.region===r)).join("")}
    </div>
    <div class="frow">
      <span class="lbl">${esc(t.fWho)}</span>
      ${chip(t.fAny,"guests","all",filt.guests==="all")}
      ${chip(t.g1,"guests","g1",filt.guests==="g1")}
      ${chip(t.g2,"guests","g2",filt.guests==="g2")}
      ${chip(t.g3,"guests","g3",filt.guests==="g3")}
      ${tags.map(k=>chip(TAGS[k][lang],"tag",k,filt.tag===k)).join("")}
    </div>`;
}

/* ---------- 카드 ---------- */
const ARROW='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const CHEV ='<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const STAR ='<svg width="13" height="13" viewBox="0 0 24 24" fill="#57534B" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.5-5.8-3.05-5.8 3.05 1.1-6.5-4.7-4.6 6.5-.95z"/></svg>';

function badgeParts(g){
  const out={flag:"", incl:""};
  if(!g.badge) return out;
  const raw=g.badgeRaw||g.badge;
  const m=/^DEAL:?(\d+)?$/.exec(g.badge);
  if(m){
    out.flag = m[1] ? `${m[1]}% ${lang==="zh"?"優惠":"off"}` : (lang==="zh"?"優惠":"Deal");
  }else if(BADGES[g.badge]){
    out.flag = BADGES[g.badge][lang];
  }else if(raw.includes("|")){
    const p=raw.split("|"); out.incl=((lang==="zh"?p[1]:p[0])||p[0]).trim();
  }
  return out;
}
function availLine(g,t){
  if(g.rooms.length>1) return g.anyWhole ? t.optWhole(g.rooms.length-1) : t.optPlain(g.rooms.length);
  if(g.anyWhole)       return t.oneGroup;
  return t.sleepsUp(g.maxSleeps);
}

function renderCards(){
  const t=T[lang], grid=document.getElementById("grid");
  const shown=props.filter(matches);
  document.getElementById("countTxt").innerHTML = props.length ? t.count(shown.length, props.length) : "";

  if(!props.length){ grid.innerHTML=`<div class="note">${t.empty}</div>`; return; }
  if(!shown.length){ grid.innerHTML=`<div class="note">${t.none}</div>`;  return; }

  grid.innerHTML = shown.map((g,i)=>{
    const name   = (lang==="zh"?g.nameZh:g.nameEn) || g.nameEn || g.nameKo;
    const region = (lang==="zh"?g.regionZh:g.regionEn) || g.regionEn;
    const intro  = (lang==="zh"?g.introZh:g.introEn) || g.introEn || "";
    const tags   = g.tags.map(k=>TAGS[k]?.[lang]).filter(Boolean).slice(0,3);
    const multi  = g.rooms.length>1;

    const bp = badgeParts(g);
    const thumb = g.photo
      ? `<img src="${esc(g.photo)}" alt="${esc(name)}" loading="lazy" decoding="async"
             style="object-position:${esc(FOCUS[g.focus]||"center")}" onerror="this.remove()">`
      : `<div class="ph" style="background:${PH[i%PH.length]}">${esc((name||"?").trim()[0])}</div>`;

    const rating = g.rating!==null
      ? `<span class="stars">${STAR}<b>${g.rating.toFixed(2)}</b>${g.reviews!==null?` <span>${t.reviews(g.reviews)}</span>`:""}</span>`
      : `<span class="stars" style="color:var(--clay)">${esc(t.newListing)}</span>`;

    const rooms = g.rooms.map(r=>{
      const rn=(lang==="zh"?r.nameZh:r.nameEn) || r.nameEn || (r.whole?t.whole:"");
      return `<a class="room" href="${esc(r.link)}" target="_blank" rel="noopener"
                 data-prop="${esc(g.id)}" data-name="${esc(g.nameEn||g.id)}" data-room="${esc(rn||t.whole)}">
        <span><span class="room-n">${esc(rn||t.whole)}</span>${r.sleeps?`<span class="room-s">${esc(t.sleeps(r.sleeps))}</span>`:""}</span>
        <span class="room-go">${esc(t.book)} ${ARROW}</span></a>`;
    }).join("");

    const primary = g.rooms[0];
    const action = `
      <a class="btn" href="${esc(primary.link)}" target="_blank" rel="noopener"
         data-prop="${esc(g.id)}" data-name="${esc(g.nameEn||g.id)}"
         data-room="${esc((lang==="zh"?primary.nameZh:primary.nameEn)||t.whole)}">${t.cta} ${ARROW}</a>
      ${multi
        ? `<div class="micro micro-a"><button type="button" data-toggle="${esc(g.id)}">${esc(t.microRooms(g.rooms.length))}</button></div>
           <div class="rooms" id="rooms-${esc(g.id)}">${rooms}</div>`
        : `<div class="micro">${esc(t.micro)}</div>`}`;

    return `<article class="card">
      <div class="thumb">${bp.flag?`<span class="flag">${esc(bp.flag)}</span>`:""}${thumb}</div>
      <div class="c-top"><span class="lbl">${esc(region)}</span>${rating}</div>
      <h3>${esc(name)}</h3>
      ${intro?`<p>${esc(intro)}</p>`:""}
      ${bp.incl?`<div class="incl">${esc(bp.incl)}</div>`:""}
      ${tags.length?`<div class="tags">${tags.map((x,j)=>`<span>${esc(x)}</span>${j<tags.length-1?"<span>·</span>":""}`).join("")}</div>`:""}
      <div class="c-foot">
        <div class="avail">${esc(availLine(g,t))}</div>
        ${action}
      </div>
    </article>`;
  }).join("");
}

/* ---------- 전체 렌더 ---------- */
function render(){
  const t=T[lang];
  document.documentElement.lang = lang==="zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k=el.dataset.t;
    const v=(SITE[k] && SITE[k][lang]) || t[k];
    if(typeof v==="string") el.innerHTML=v;
  });
  document.querySelectorAll(".lang button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));

  document.getElementById("statStays").textContent = props.length || "—";
  document.getElementById("statVillages").textContent =
    new Set(props.map(g=>g.region).filter(Boolean)).size || "—";

  const rated = props.filter(g=>g.rating!==null && g.reviews);
  const wrap = document.getElementById("avgWrap");
  if(rated.length){
    const w = rated.reduce((s,g)=>s+g.rating*g.reviews,0) / rated.reduce((s,g)=>s+g.reviews,0);
    document.getElementById("avgVal").textContent = w.toFixed(2);
    wrap.hidden=false;
  } else wrap.hidden=true;

  if(HERO?.stay){
    const s=HERO.stay;
    document.getElementById("heroCapTxt").textContent =
      `${(lang==="zh"?s.nameZh:s.nameEn)||s.nameEn} · ${shortRegion(lang==="zh"?s.regionZh:s.regionEn)}`;
  }

  renderFilters();
  renderCards();
}

function skeleton(){
  document.getElementById("grid").innerHTML =
    Array.from({length:6}).map(()=>
      `<div class="sk"><div class="a shim"></div><div class="b shim"></div><div class="c shim"></div></div>`).join("");
}

/* ---------- 로드 ---------- */
async function load(){
  skeleton();
  try{
    const res=await fetch(CSV_URL,{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const built=build(parseCSV(await res.text()));
    props=built.list;
    applyHero(built.site["_hero"]);
    render();
  }catch(e){
    props=[]; render();
    document.getElementById("grid").innerHTML=`<div class="note">${T[lang].error}</div>`;
  }
}

/* ---------- 이벤트 ---------- */
function track(name, params){
  try{ if(typeof gtag==="function") gtag("event", name, params); }catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>{
  b.addEventListener("click",()=>{
    lang=b.dataset.lang;
    try{ localStorage.setItem("mm_lang", lang); }catch(e){}
    track("language_switch",{language:lang});
    render();
  });
});
try{ const s=localStorage.getItem("mm_lang"); if(s&&T[s]) lang=s; }catch(e){}

document.getElementById("filters").addEventListener("click", e=>{
  const b=e.target.closest("button[data-f]"); if(!b) return;
  filt[b.dataset.f] = b.dataset.v;
  track("filter_change",{filter_type:b.dataset.f, filter_value:b.dataset.v, language:lang});
  renderFilters(); renderCards();
});

document.getElementById("grid").addEventListener("click", e=>{
  const a=e.target.closest("a[data-prop]");
  if(a){
    track("airbnb_click",{stay:a.dataset.prop, stay_name:a.dataset.name, room:a.dataset.room, language:lang});
    return;
  }
  const b=e.target.closest("button[data-toggle]");
  if(b){
    const box=document.getElementById("rooms-"+b.dataset.toggle);
    const open=box.classList.toggle("open");
    b.textContent = open ? T[lang].ctaHide : T[lang].microRooms(box.children.length);
    if(open) track("rooms_open",{stay:b.dataset.toggle, language:lang});
  }
});
document.getElementById("heroCta").addEventListener("click",()=>track("hero_cta",{language:lang}));

load();
</script>
